name: Protiti Flutter CI

# Every branch: recent work lives on feature branches such as jev_int.
on:
  push:
    branches: [ '**' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get
        working-directory: dkc

      - name: Check Formatting
        run: dart format --output=none --set-exit-if-changed .
        working-directory: dkc

      - name: Analyze Static Code
        run: flutter analyze
        working-directory: dkc

      - name: Run Unit Tests
        run: flutter test
        working-directory: dkc
